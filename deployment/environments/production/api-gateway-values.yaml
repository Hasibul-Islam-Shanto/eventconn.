# Production Environment Values: api-gateway (Node/Express API Gateway)
fullnameOverride: "api-gateway"

replicaCount: 2

image:
  repository: "ghcr.io/hasibul-islam-shanto/eventconn-api-gateway"
  pullPolicy: IfNotPresent
  tag: "v1.0.0"

service:
  type: ClusterIP
  port: 4000
  targetPort: 4000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
  hosts:
    - host: "api.eventconn.com"
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: eventconn-api-gateway-tls
      hosts:
        - "api.eventconn.com"

resources:
  limits:
    cpu: 800m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

livenessProbe:
  enabled: true
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 2

env:
  NODE_ENV: "production"
  PORT: "4000"
  LOG_LEVEL: "info"
  CLIENT_ORIGIN: "https://eventconn.com"
  AUTH_SERVICE_URL: "http://auth-service:4001"
  EVENT_SERVICE_URL: "http://event-service:4002"
  BOOKING_SERVICE_URL: "http://booking-service:4003"
  PAYMENT_SERVICE_URL: "http://payment-service:4005"

envFromSecrets:
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: eventconn-shared-secrets
        key: jwt-secret
  - name: INTERNAL_SECRET
    valueFrom:
      secretKeyRef:
        name: eventconn-shared-secrets
        key: internal-secret

migration:
  enabled: false

autoscaling:
  enabled: false
