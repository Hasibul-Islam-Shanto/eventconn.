name: Production CI/CD Pipeline (GitOps with ArgoCD & Docker Hub)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: gitops-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write        # Required to commit updated image tags to Git repository
  security-events: write # Required to upload SARIF security scan results
  actions: read

jobs:
  # ----------------------------------------------------------------------------
  # 1. QUALITY GATE & AUTOMATED TESTING
  # ----------------------------------------------------------------------------
  test:
    name: Test & Quality Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      # Client Checks
      - name: Install Client Dependencies
        run: cd client && npm ci

      - name: Lint Client
        run: cd client && npm run lint

      - name: Typecheck Client
        run: cd client && npm run typecheck

      - name: Run Client Unit Tests
        run: cd client && npm test

      # Server Checks & DB Initialization
      - name: Initialize PostgreSQL Test Databases
        run: |
          for db in auth_test event_test booking_test notification_test payment_test; do
            docker exec ${{ job.services.postgres.id }} psql -U postgres -d postgres -c "CREATE DATABASE $db;"
          done

      - name: Install Server Dependencies
        run: cd server && npm ci

      - name: Generate Prisma Clients
        run: cd server && npm run db:generate

      - name: Migrate Test Databases
        env:
          AUTH_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/auth_test
          EVENT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/event_test
          BOOKING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/booking_test
          NOTIFICATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/notification_test
          PAYMENT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/payment_test
        run: cd server && npm run db:migrate

      - name: Lint Server
        run: cd server && npm run lint

      - name: Typecheck Server
        run: cd server && npm run typecheck

      - name: Run Server Unit & Integration Tests
        env:
          NODE_ENV: test
          JWT_SECRET: ci-testing-jwt-secret-at-least-thirty-two-chars
          INTERNAL_SECRET: ci-testing-internal-secret-at-least-32-chars
          RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672
          AUTH_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/auth_test
          EVENT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/event_test
          BOOKING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/booking_test
          NOTIFICATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/notification_test
          PAYMENT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/payment_test
        run: cd server && npm test

  # ----------------------------------------------------------------------------
  # 2. OWASP DEPENDENCY SECURITY AUDIT
  # ----------------------------------------------------------------------------
  owasp-security:
    name: OWASP Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        with:
          project: 'EventConn'
          path: '.'
          format: 'HTML,SARIF'
          out: 'reports'
          args: >
            --enableRetired
            --scan client/package-lock.json
            --scan server/package-lock.json

      - name: Upload OWASP SARIF Report to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('reports/dependency-check-report.sarif') != ''
        with:
          sarif_file: 'reports/dependency-check-report.sarif'
          category: 'owasp-dependency-check'

      - name: Upload OWASP HTML Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-check-report
          path: reports/

      - name: NPM Production Dependencies Audit
        run: |
          echo "=== Auditing Client Production Dependencies ==="
          cd client && npm audit --omit=dev --audit-level=critical || true
          echo "=== Auditing Server Production Dependencies ==="
          cd ../server && npm audit --omit=dev --audit-level=critical || true

  # ----------------------------------------------------------------------------
  # 3. BUILD, TRIVY CONTAINER SCAN & PUSH TO DOCKER HUB
  # ----------------------------------------------------------------------------
  build-and-push:
    name: Build, Scan & Push (${{ matrix.service }})
    needs: [test, owasp-security]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: ./client
            dockerfile: ./client/Dockerfile
            image_name: eventconn-frontend
          - service: api-gateway
            context: ./server
            dockerfile: ./server/apps/api-gateway/Dockerfile
            image_name: eventconn-api-gateway
          - service: auth-service
            context: ./server
            dockerfile: ./server/apps/auth-service/Dockerfile
            image_name: eventconn-auth-service
          - service: event-service
            context: ./server
            dockerfile: ./server/apps/event-service/Dockerfile
            image_name: eventconn-event-service
          - service: booking-service
            context: ./server
            dockerfile: ./server/apps/booking-service/Dockerfile
            image_name: eventconn-booking-service
          - service: notification-service
            context: ./server
            dockerfile: ./server/apps/notification-service/Dockerfile
            image_name: eventconn-notification-service
          - service: payment-service
            context: ./server
            dockerfile: ./server/apps/payment-service/Dockerfile
            image_name: eventconn-payment-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Define Image Tags
        id: meta
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image_name }}"
          SHA_TAG="${REPO}:${{ github.sha }}"
          LATEST_TAG="${REPO}:latest"

          echo "repo=${REPO}" >> $GITHUB_OUTPUT
          echo "tag_sha=${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "tag_latest=${LATEST_TAG}" >> $GITHUB_OUTPUT

      # Build container image and load it locally for Trivy scanning
      - name: Build Container Image Locally
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: ${{ steps.meta.outputs.tag_sha }}
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Security Scanning with Trivy
      - name: Run Trivy Vulnerability Scanner on Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.tag_sha }}
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy SARIF Report to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles(format('trivy-results-{0}.sarif', matrix.service)) != ''
        with:
          sarif_file: 'trivy-results-${{ matrix.service }}.sarif'
          category: 'trivy-${{ matrix.service }}'

      - name: Print Trivy Scan Summary Table
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.tag_sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      # Push scanned image to Docker Hub
      - name: Push Container Images to Docker Hub
        run: |
          docker tag "${{ steps.meta.outputs.tag_sha }}" "${{ steps.meta.outputs.tag_latest }}"
          docker push "${{ steps.meta.outputs.tag_sha }}"
          docker push "${{ steps.meta.outputs.tag_latest }}"

  # ----------------------------------------------------------------------------
  # 4. GITOPS PROMOTION (Update Git Manifests for ArgoCD)
  # ----------------------------------------------------------------------------
  gitops-promote:
    name: GitOps Promotion (ArgoCD)
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Write Permission
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Update Production Values with New Docker Hub Tags
        run: |
          DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          NEW_TAG="${{ github.sha }}"

          echo "Updating GitOps values files to image tag: ${NEW_TAG} for user: ${DOCKER_USER}..."

          # 1. Update individual microservice values files used by ArgoCD
          SERVICES=("frontend" "api-gateway" "auth-service" "event-service" "booking-service" "notification-service" "payment-service")
          for svc in "${SERVICES[@]}"; do
            FILE="deployment/environments/production/${svc}-values.yaml"
            if [ -f "${FILE}" ]; then
              sed -i -E "s|repository: .*|repository: \"${DOCKER_USER}/eventconn-${svc}\"|g" "${FILE}"
              sed -i -E "s|tag: .*|tag: \"${NEW_TAG}\"|g" "${FILE}"
              echo "Updated ${FILE}"
            fi
          done

          # 2. Update umbrella production values file
          VALUES_FILE="deployment/production/values.yaml"
          if [ -f "${VALUES_FILE}" ]; then
            for svc in "${SERVICES[@]}"; do
              sed -i -E "s|repository: \".*eventconn-${svc}\"|repository: \"${DOCKER_USER}/eventconn-${svc}\"|g" "${VALUES_FILE}"
            done
            sed -i -E "s|tag: \"v[0-9]+\.[0-9]+\.[0-9]+\"|tag: \"${NEW_TAG}\"|g" "${VALUES_FILE}"
            echo "Updated ${VALUES_FILE}"
          fi

      - name: Commit and Push Image Tag Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add deployment/environments/production/*-values.yaml deployment/production/values.yaml

          if git diff --staged --quiet; then
            echo "No changes in values files to commit."
          else
            git commit -m "chore(gitops): update production image tags to ${{ github.sha }} [skip ci]"
            git push origin main
            echo "GitOps commit pushed to main! ArgoCD will now sync the cluster automatically."
          fi

      - name: GitOps Deployment Summary
        run: |
          echo "### 🚀 GitOps Promotion Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Hub User:** \`${{ secrets.DOCKERHUB_USERNAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed Commit SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Updated \`deployment/environments/production/*-values.yaml\`." >> $GITHUB_STEP_SUMMARY
          echo "- **ArgoCD:** ArgoCD running in your EC2 cluster will automatically detect this commit and roll out the new images with zero downtime." >> $GITHUB_STEP_SUMMARY
