  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    NODE_ENV: "development"
    PORT: "4001"
    LOG_LEVEL: "info"
    CLIENT_ORIGIN: "http://localhost:3000"
  migration:
