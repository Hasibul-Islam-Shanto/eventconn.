      memory: 128Mi
    limits:
      cpu: 800m
      memory: 512Mi
  env:
    NODE_ENV: "production"
    PORT: "4001"
    LOG_LEVEL: "info"
    CLIENT_ORIGIN: "http://184.197.8.30:30000"
  migration:
    enabled: false
  autoscaling:
