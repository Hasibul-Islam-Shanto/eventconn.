# Production Environment Values: event-service (Node/TypeScript + Prisma + PostgreSQL)
fullnameOverride: "event-service"

replicaCount: 2

image:
  repository: "shanto78/eventconn-event-service"
  pullPolicy: IfNotPresent
  tag: "34e3ad14869c37ffc4839fc0b4d8aaa330fad9c1"

service:
  type: ClusterIP
  port: 4002
  targetPort: 4002

ingress:
  enabled: false

resources:
  limits:
    cpu: 600m
    memory: 512Mi
  requests:
    cpu: 150m
    memory: 256Mi

livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 2

env:
  NODE_ENV: "production"
  PORT: "4002"
  LOG_LEVEL: "info"

envFromSecrets:
  - name: EVENT_DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: eventconn-database-secrets
        key: event-database-url
  - name: RABBITMQ_URL
    valueFrom:
      secretKeyRef:
        name: eventconn-shared-secrets
        key: rabbitmq-url
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: eventconn-shared-secrets
        key: jwt-secret
  - name: INTERNAL_SECRET
    valueFrom:
      secretKeyRef:
        name: eventconn-shared-secrets
        key: internal-secret

migration:
  enabled: true
  command: ["npx", "prisma", "migrate", "deploy", "--schema", "apps/event-service/prisma/schema.prisma"]
  backoffLimit: 3
  resources:
    limits:
      cpu: 400m
      memory: 384Mi
    requests:
      cpu: 100m
      memory: 128Mi

autoscaling:
  enabled: false
