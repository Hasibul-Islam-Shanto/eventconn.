# Umbrella Chart Values: EventConn Full Stack
# Each top-level key corresponds to the alias defined in Chart.yaml

infrastructure:
  postgres:
    enabled: true
  rabbitmq:
    enabled: true
  secrets:
    enabled: true
    jwtSecret: "local-only-change-this-32-character-jwt-secret"
    internalSecret: "local-only-change-this-32-character-internal-secret"
    rabbitmqUrl: "amqp://guest:guest@rabbitmq:5672"
    authDatabaseUrl: "postgresql://postgres:postgres@postgres:5432/auth_db"
    eventDatabaseUrl: "postgresql://postgres:postgres@postgres:5432/event_db"
    bookingDatabaseUrl: "postgresql://postgres:postgres@postgres:5432/booking_db"
    notificationDatabaseUrl: "postgresql://postgres:postgres@postgres:5432/notification_db"
    paymentDatabaseUrl: "postgresql://postgres:postgres@postgres:5432/payment_db"
    smtpUser: ""
    smtpPass: ""


frontend:
  fullnameOverride: "frontend"
  replicaCount: 1
  image:
    repository: "ghcr.io/hasibul-islam-shanto/eventconn-frontend"
    pullPolicy: IfNotPresent
    tag: "v1.0.0"
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    hosts:
      - host: "eventconn.com"
        paths:
          - path: /
            pathType: Prefix
      - host: "www.eventconn.com"
        paths:
          - path: /
            pathType: Prefix
    tls: []
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 64Mi
  livenessProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 20
    periodSeconds: 15
  readinessProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
  env:
    NODE_ENV: "production"
    PORT: "3000"
    NEXT_PUBLIC_API_BASE_URL: "http://api.eventconn.com/api"
  autoscaling:
    enabled: false

api-gateway:
  fullnameOverride: "api-gateway"
  replicaCount: 1
  image:
    repository: "ghcr.io/hasibul-islam-shanto/eventconn-api-gateway"
    pullPolicy: IfNotPresent
    tag: "v1.0.0"
  service:
    type: ClusterIP
    port: 4000
    targetPort: 4000
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    hosts:
      - host: "api.eventconn.com"
        paths:
          - path: /
            pathType: Prefix
    tls: []
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 64Mi
  livenessProbe:
    enabled: true
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10
  readinessProbe:
    enabled: true
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
  env:
    NODE_ENV: "production"
    PORT: "4000"
    LOG_LEVEL: "info"
    CLIENT_ORIGIN: "http://eventconn.com"
    AUTH_SERVICE_URL: "http://auth-service:4001"
    EVENT_SERVICE_URL: "http://event-service:4002"
    BOOKING_SERVICE_URL: "http://booking-service:4003"
    PAYMENT_SERVICE_URL: "http://payment-service:4005"
  envFromSecrets:
    - name: JWT_SECRET
      valueFrom:
        secretKeyRef:
          name: eventconn-shared-secrets
          key: jwt-secret
    - name: INTERNAL_SECRET
      valueFrom:
        secretKeyRef:
          name: eventconn-shared-secrets
          key: internal-secret
  migration:
    enabled: false
  autoscaling:
    enabled: false

