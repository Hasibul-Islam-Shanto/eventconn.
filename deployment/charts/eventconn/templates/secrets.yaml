{{- if .Values.infrastructure.secrets.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: eventconn-shared-secrets
  labels:
    app.kubernetes.io/part-of: eventconn
type: Opaque
stringData:
  jwt-secret: {{ .Values.infrastructure.secrets.jwtSecret | quote }}
  internal-secret: {{ .Values.infrastructure.secrets.internalSecret | quote }}
  rabbitmq-url: {{ .Values.infrastructure.secrets.rabbitmqUrl | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: eventconn-database-secrets
  labels:
    app.kubernetes.io/part-of: eventconn
type: Opaque
stringData:
  auth-database-url: {{ .Values.infrastructure.secrets.authDatabaseUrl | quote }}
  event-database-url: {{ .Values.infrastructure.secrets.eventDatabaseUrl | quote }}
  booking-database-url: {{ .Values.infrastructure.secrets.bookingDatabaseUrl | quote }}
  notification-database-url: {{ .Values.infrastructure.secrets.notificationDatabaseUrl | quote }}
  payment-database-url: {{ .Values.infrastructure.secrets.paymentDatabaseUrl | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: eventconn-smtp-secrets
  labels:
    app.kubernetes.io/part-of: eventconn
type: Opaque
stringData:
  smtp-user: {{ .Values.infrastructure.secrets.smtpUser | default "" | quote }}
  smtp-pass: {{ .Values.infrastructure.secrets.smtpPass | default "" | quote }}
{{- end }}
