# Example Kubernetes Secrets for EventConn in Production
# Apply to your cluster before or alongside ArgoCD sync:
# kubectl apply -f environments/production/secrets.example.yaml -n production
apiVersion: v1
kind: Secret
metadata:
  name: eventconn-shared-secrets
  namespace: production
  labels:
    app.kubernetes.io/part-of: eventconn
    environment: production
type: Opaque
stringData:
  # Minimum 32-character secrets for cryptographic signing and inter-service authentication
  jwt-secret: "local-only-change-this-32-character-jwt-secret"
  internal-secret: "local-only-change-this-32-character-internal-secret"
  
  # RabbitMQ URL for asynchronous message queues
  # If running RabbitMQ inside Kubernetes cluster: amqp://guest:guest@rabbitmq:5672
  # If running in Docker on EC2 host: amqp://guest:guest@<ec2-ip-or-host>:5672
  rabbitmq-url: "amqp://guest:guest@rabbitmq:5672"

---
apiVersion: v1
kind: Secret
metadata:
  name: eventconn-database-secrets
  namespace: production
  labels:
    app.kubernetes.io/part-of: eventconn
    environment: production
type: Opaque
stringData:
  # PostgreSQL Connection Strings (from server/.env and Docker PostgreSQL setup)
  # If PostgreSQL runs as Docker container in K8s: postgresql://postgres:postgres@postgres:5432/<db_name>
  # If PostgreSQL runs on EC2 host: postgresql://postgres:postgres@<ec2-ip-or-host>:5432/<db_name>
  auth-database-url: "postgresql://postgres:postgres@postgres:5432/auth_db"
  event-database-url: "postgresql://postgres:postgres@postgres:5432/event_db"
  booking-database-url: "postgresql://postgres:postgres@postgres:5432/booking_db"
  notification-database-url: "postgresql://postgres:postgres@postgres:5432/notification_db"
  payment-database-url: "postgresql://postgres:postgres@postgres:5432/payment_db"

---
apiVersion: v1
kind: Secret
metadata:
  name: eventconn-smtp-secrets
  namespace: production
  labels:
    app.kubernetes.io/part-of: eventconn
    environment: production
type: Opaque
stringData:
  smtp-user: ""
  smtp-pass: ""
