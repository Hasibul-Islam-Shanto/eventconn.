---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: eventconn-shared-secrets
  namespace: production
spec:
  encryptedData:
    internal-secret: 
    jwt-secret: 
    rabbitmq-url: 
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: eventconn
        environment: production
      name: eventconn-shared-secrets
      namespace: production
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: eventconn-database-secrets
  namespace: production
spec:
  encryptedData:
    auth-database-url: 
    booking-database-url: 
    event-database-url: 
    notification-database-url: 
    payment-database-url: 
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: eventconn
        environment: production
      name: eventconn-database-secrets
      namespace: production
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: eventconn-smtp-secrets
  namespace: production
spec:
  encryptedData:
    smtp-pass: 
    smtp-user: 
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: eventconn
        environment: production
      name: eventconn-smtp-secrets
      namespace: production
    type: Opaque
