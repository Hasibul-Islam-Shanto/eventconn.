x-app-env: &app-env
  NODE_ENV: development
  LOG_LEVEL: info
  JWT_SECRET: replace-with-a-random-secret-at-least-32-characters
  INTERNAL_SECRET: replace-with-another-random-secret-at-least-32-characters
  CLIENT_ORIGIN: http://localhost:3000
  AUTH_SERVICE_URL: http://auth-service:4001
  EVENT_SERVICE_URL: http://event-service:4002
  BOOKING_SERVICE_URL: http://booking-service:4003
  PAYMENT_SERVICE_URL: http://payment-service:4005
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
  HOLD_MINUTES: "10"
  AUTH_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/auth_db
  EVENT_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/event_db
  BOOKING_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/booking_db
  NOTIFICATION_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/notification_db
  PAYMENT_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/payment_db
  SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-EventConn Tickets <no-reply@eventconn.com>}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  auth-service:
    build:
      context: ./server
      dockerfile: apps/auth-service/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *app-env
      PORT: "4001"

  event-service:
    build:
      context: ./server
      dockerfile: apps/event-service/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *app-env
      PORT: "4002"
      RUN_SEED: "true"

  booking-service:
    build:
      context: ./server
      dockerfile: apps/booking-service/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *app-env
      PORT: "4003"

  notification-service:
    build:
      context: ./server
      dockerfile: apps/notification-service/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *app-env
      PORT: "4004"

  payment-service:
    build:
      context: ./server
      dockerfile: apps/payment-service/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *app-env
      PORT: "4005"

  api-gateway:
    build:
      context: ./server
      dockerfile: apps/api-gateway/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      <<: *app-env
      PORT: "4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
