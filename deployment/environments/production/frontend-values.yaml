# Production Environment Values: frontend (Next.js)
fullnameOverride: "frontend"

replicaCount: 1

image:
  repository: "shanto78/eventconn-frontend"
  pullPolicy: IfNotPresent
  tag: "6ce0309468a55782f3318e5abe3c6e558d5cc063"

service:
  type: NodePort
  port: 3000
  targetPort: 3000
  nodePort: 30000

ingress:
  enabled: true
  className: ""
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
  hosts:
    - host: "184.197.8.30"
      paths:
        - path: /
          pathType: Prefix
    - host: "eventconn.com"
      paths:
        - path: /
          pathType: Prefix
    - host: "www.eventconn.com"
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 600m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 20
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

env:
  NODE_ENV: "production"
  PORT: "3000"
  NEXT_PUBLIC_API_BASE_URL: "http://184.197.8.30:30001/api"

autoscaling:
  enabled: false
