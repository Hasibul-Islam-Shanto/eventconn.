# Default values for base-microservice chart.
# This is a DRY base chart intended to be populated by environment value files.

replicaCount: 2

image:
  repository: ""
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account (e.g. for AWS IRSA / EKS IAM roles)
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}
extraLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  protocol: TCP
  annotations: {}

ingress:
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts: []
  # Example:
  #   - host: app.example.com
  #     paths:
  #       - path: /
  #         pathType: Prefix
  tls: []
  # Example:
  #   - secretName: app-tls
  #     hosts:
  #       - app.example.com

# Resource requests and limits (Production-grade baseline for microservices)
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Health checks with sensible defaults for Node.js / Next.js
livenessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 2
  successThreshold: 1
  failureThreshold: 2

startupProbe:
  enabled: false
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 12

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Environment variables
# Literal key-value pairs
env: {}
# Example:
#   NODE_ENV: production
#   PORT: "8080"

# Environment variables from Kubernetes Secrets or ConfigMaps
# Format:
#   - name: DATABASE_URL
#     valueFrom:
#       secretKeyRef:
#         name: auth-service-secrets
#         key: database-url
envFromSecrets: []

# Entire Secret or ConfigMap references via envFrom
envFrom: []
# Example:
#   - secretRef:
#       name: auth-service-secrets
#   - configMapRef:
#       name: app-config

# Volumes and Volume Mounts
volumes: []
volumeMounts: []

# Optional Helm Pre-Install / Pre-Upgrade Database Migration Job
migration:
  enabled: false
  image: "" # Defaults to main container image if empty
  command: ["npx", "prisma", "migrate", "deploy"]
  backoffLimit: 3
  restartPolicy: Never
  resources:
    limits:
      cpu: 300m
      memory: 384Mi
    requests:
      cpu: 100m
      memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
