# Production Environment Values: frontend (Next.js)
fullnameOverride: "frontend"

replicaCount: 3

image:
  repository: "shanto78/eventconn-frontend"
  pullPolicy: IfNotPresent
  tag: "edf26a8176e7d26da79d5685fda7ab3e87afb7a1"

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
  hosts:
    - host: "eventconn.com"
      paths:
        - path: /
          pathType: Prefix
    - host: "www.eventconn.com"
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 20
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

env:
  NODE_ENV: "production"
  PORT: "3000"
  # Set to your EC2 public IP or domain:
  NEXT_PUBLIC_API_BASE_URL: "http://<YOUR_EC2_IP>:4000/api"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 8
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80
