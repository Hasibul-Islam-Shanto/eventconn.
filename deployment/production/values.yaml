# ==============================================================================
# PRODUCTION ENVIRONMENT VALUES (EC2 DEPLOYMENT)
# Umbrella Chart: eventconn
#
# QUICK START FOR EC2:
# 1. Replace <YOUR_EC2_IP> with your EC2 Public IP (e.g. 54.210.12.34) or domain.
# 2. Or pass it directly during helm install/upgrade:
#    helm upgrade --install eventconn deployment/charts/eventconn \
#      -n production \
#      -f deployment/environments/production/values.yaml \
#      --set frontend.env.NEXT_PUBLIC_API_BASE_URL="http://<YOUR_EC2_IP>:4000/api" \
#      --set api-gateway.env.CLIENT_ORIGIN="http://<YOUR_EC2_IP>:3000"
# ==============================================================================

# Shared Infrastructure (Set enabled: false if using AWS RDS / Managed RabbitMQ)
infrastructure:
  postgres:
    enabled: true
  rabbitmq:
    enabled: true
  secrets:
    enabled: true
    # CHANGE THESE TO SECURE STRINGS IN REAL PRODUCTION:
    jwtSecret: "change-me-to-a-secure-production-jwt-secret-min-32-chars"
    internalSecret: "change-me-to-a-secure-production-internal-secret-min-32-chars"
    rabbitmqUrl: "amqp://guest:guest@rabbitmq:5672"
    authDatabaseUrl: "postgresql://postgres:postgres@postgres:5432/auth_db"
    eventDatabaseUrl: "postgresql://postgres:postgres@postgres:5432/event_db"
    bookingDatabaseUrl: "postgresql://postgres:postgres@postgres:5432/booking_db"
    notificationDatabaseUrl: "postgresql://postgres:postgres@postgres:5432/notification_db"
    paymentDatabaseUrl: "postgresql://postgres:postgres@postgres:5432/payment_db"
    smtpUser: ""
    smtpPass: ""

frontend:
  fullnameOverride: "frontend"
  replicaCount: 2
  image:
    repository: "shanto78/eventconn-frontend"
    pullPolicy: IfNotPresent
    tag: "34e3ad14869c37ffc4839fc0b4d8aaa330fad9c1"
  service:
    type: NodePort
    port: 3000
    targetPort: 3000
    nodePort: 30000
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  livenessProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 20
    periodSeconds: 15
  readinessProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
  env:
    NODE_ENV: "production"
    PORT: "3000"
    # REPLACE <YOUR_EC2_IP> WITH YOUR ACTUAL EC2 PUBLIC IP OR DOMAIN:
    NEXT_PUBLIC_API_BASE_URL: "http://184.197.8.30:30001/api"
  autoscaling:
    enabled: false

api-gateway:
  fullnameOverride: "api-gateway"
  replicaCount: 2
  image:
    repository: "shanto78/eventconn-api-gateway"
    pullPolicy: IfNotPresent
    tag: "34e3ad14869c37ffc4839fc0b4d8aaa330fad9c1"
  service:
    type: NodePort
    port: 4000
    targetPort: 4000
    nodePort: 30001
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 800m
      memory: 512Mi
  livenessProbe:
    enabled: true
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10
  readinessProbe:
    enabled: true
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
  env:
    NODE_ENV: "production"
    PORT: "4000"
    LOG_LEVEL: "info"
    # REPLACE <YOUR_EC2_IP> WITH YOUR ACTUAL EC2 PUBLIC IP OR DOMAIN:
    CLIENT_ORIGIN: "http://184.197.8.30:30000"
    AUTH_SERVICE_URL: "http://auth-service:4001"
    EVENT_SERVICE_URL: "http://event-service:4002"
    BOOKING_SERVICE_URL: "http://booking-service:4003"
    PAYMENT_SERVICE_URL: "http://payment-service:4005"
  autoscaling:
    enabled: false

