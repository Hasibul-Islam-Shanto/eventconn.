# Production Environment Values: api-gateway (Node/Express API Gateway)
fullnameOverride: "api-gateway"

replicaCount: 1

image:
  repository: "shanto78/eventconn-api-gateway"
  pullPolicy: IfNotPresent
  tag: "5f3693975c12b4e3a1194aeeec3598cc9fd1abcd"

service:
  type: NodePort
  port: 4000
  targetPort: 4000
  nodePort: 30001

ingress:
  enabled: false
  className: ""
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
  hosts:
    - host: "ec2-184-197-8-30.compute-1.amazonaws.com"
      paths:
        - path: /api
          pathType: Prefix
    - host: "api.eventconn.com"
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi

livenessProbe:
  enabled: true
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 2

env:
  NODE_ENV: "production"
  PORT: "4000"
  LOG_LEVEL: "info"
  # Set to your EC2 public IP or domain:
  CLIENT_ORIGIN: "http://184.197.8.30:30000"
  AUTH_SERVICE_URL: "http://auth-service:4001"
  EVENT_SERVICE_URL: "http://event-service:4002"
  BOOKING_SERVICE_URL: "http://booking-service:4003"
  PAYMENT_SERVICE_URL: "http://payment-service:4005"

envFromSecrets:
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: eventconn-shared-secrets
        key: jwt-secret
  - name: INTERNAL_SECRET
    valueFrom:
      secretKeyRef:
        name: eventconn-shared-secrets
        key: internal-secret

migration:
  enabled: false

autoscaling:
  enabled: false
